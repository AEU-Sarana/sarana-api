services:
  # Dev app service. The Makefile expects the service name "app".
  # The base docker-compose.yml uses "app-dev"; this override provides "app"
  # so `make up/down/shell/logs` work consistently in dev.
  app-dev:
    build:
      context: .
      target: development
    container_name: stock-pos-app-dev
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: development
      PORT: ${PORT:-3000}
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-stock_pos}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev-secret}
      JWT_EXPIRES_IN: 7d
    volumes:
      - .:/app
      - /app/node_modules
      - /app/dist
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "pnpm config set store-dir /app/.pnpm-store && pnpm config set node-linker hoisted && pnpm install --frozen-lockfile && (cd /app/node_modules/@prisma/client/runtime && ln -sf query_compiler_fast_bg.postgresql.mjs query_compiler_bg.postgresql.mjs 2>/dev/null || true) && pnpm db:generate && pnpm migrate:apply && pnpm dev"
    networks:
      - stock-pos-network
    profiles:
      - dev

  nginx:
    depends_on:
      - app
    profiles:
      - dev
