services:
  app:
    build:
      context: .
      target: development
    container_name: stock-pos-app-dev
    user: "${UID:-1000}:${GID:-1000}"
    env_file:
      - .env
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      API_BASE_URL: ${API_BASE_URL:-http://localhost:3000}
      BREVO_API_KEY: ${BREVO_API_KEY}
      BREVO_SENDER_EMAIL: ${BREVO_SENDER_EMAIL}
      BREVO_SENDER_NAME: ${BREVO_SENDER_NAME}

      # ✅ Internal Docker network
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-stock_pos}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-stock_pos}

      # ✅ Redis internal
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_URL: redis://redis:6379

      JWT_SECRET: ${JWT_SECRET:-dev-secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-dev-refresh-secret}

      # Optional: prefer only these and remove JWT_EXPIRES_IN to avoid confusion
      JWT_ACCESS_TOKEN_EXPIRY: ${JWT_ACCESS_TOKEN_EXPIRY:-24h}
      JWT_REFRESH_TOKEN_EXPIRY: ${JWT_REFRESH_TOKEN_EXPIRY:-7d}

      # JWT V2
      JWT_V2_ACCESS_TOKEN_EXPIRY: ${JWT_V2_ACCESS_TOKEN_EXPIRY:-10m}
      JWT_V2_REFRESH_ABSOLUTE_DAYS: ${JWT_V2_REFRESH_ABSOLUTE_DAYS:-30}
      JWT_V2_REFRESH_IDLE_DAYS: ${JWT_V2_REFRESH_IDLE_DAYS:-7}
      JWT_ISSUER: ${JWT_ISSUER:-stock-pos-api}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-stock-pos-mobile}

      # ✅ Timezone for Node inside container
      TZ: Asia/Phnom_Penh
      CI: "true"
    volumes:
      - .:/app
      - ./node_modules:/app/node_modules
      - ./dist:/app/dist
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "pnpm config set store-dir /tmp/.pnpm-store && pnpm config set node-linker hoisted && ([ -f /app/node_modules/.install-complete ] || (pnpm install --frozen-lockfile --force && touch /app/node_modules/.install-complete)) && (cd /app/node_modules/@prisma/client/runtime && ln -sf query_compiler_fast_bg.postgresql.mjs query_compiler_bg.postgresql.mjs 2>/dev/null || true) && pnpm db:generate && pnpm migrate:apply && pnpm dev"
    networks:
      - internal-network
    profiles:
      - dev

  nginx:
    depends_on:
      - app
    profiles:
      - dev