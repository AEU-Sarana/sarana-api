[defaults]
# Ansible configuration file for Stock POS Server deployment

inventory = ansible/inventory
roles_path = ansible/roles
host_key_checking = False
gathering = smart
fact_caching = jsonfile
fact_caching_connection = /tmp/ansible_facts
fact_caching_timeout = 3600

# Parallel execution for faster deployments
forks = 5

# Retry configuration
max_retries = 3
retries = 3

# Display settings
stdout_callback = yaml

# SSH configuration
[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -C -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no
pipelining = True
control_path = /tmp/ansible-ssh-%%h-%%p-%%r
