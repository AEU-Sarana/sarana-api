version: '3.8'

services:
  # Database
  db:
    image: postgres:15-alpine
    container_name: stock-pos-db
    environment:
      POSTGRES_USER: ${DB_USER:-stockpos}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-stockpos}
      POSTGRES_DB: ${DB_NAME:-stock_pos}
      PGTZ: ${DB_TIMEZONE:-UTC}
      TZ: ${SYSTEM_TIMEZONE:-UTC}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - ./docker/postgres/init-timezone.sql:/docker-entrypoint-initdb.d/01-timezone.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-stockpos}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal-network

  # Redis for Bull Queue
  redis:
    image: redis:7-alpine
    container_name: stock-pos-redis
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal-network

  # Minio for object storage
  minio:
    image: minio/minio:latest
    container_name: stock-pos-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped
    networks:
      - internal-network

  # Application
  app:
    image: ${DOCKER_REGISTRY}/${DOCKER_IMAGE_NAME}:${DOCKER_IMAGE_TAG}
    container_name: stock-pos-app
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: ${PORT:-3000}
      TZ: Asia/Phnom_Penh
    expose:
      - "3000"
    volumes:
      - app-logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - internal-network
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # Nginx reverse proxy (public facing)
  nginx:
    image: nginx:alpine
    container_name: stock-pos-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
      - nginx-cache:/var/cache/nginx
      - nginx-logs:/var/log/nginx
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - internal-network
      - external-network

volumes:
  postgres-data:
  redis-data:
  minio-data:
  app-logs:
  nginx-cache:
  nginx-logs:

networks:
  # Private network for internal container communication
  internal-network:
    driver: bridge
  
  # Public network for external access (only nginx exposed)
  external-network:
    driver: bridge