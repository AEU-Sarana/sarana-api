---
# Health check playbook
- name: Health Check for Stock POS Server
  hosts: "{{ inventory_hostname.split('-')[0] }}"
  gather_facts: yes

  tasks:
    - name: Wait for API to be ready
      uri:
        url: 'http://localhost:{{ app_port }}/health'
        method: GET
        status_code: 200
      register: api_health
      retries: 10
      delay: 5
      until: api_health.status == 200

    - name: Check Docker container status
      docker_container_info:
        name: '{{ docker_container_name }}'
      register: container_info

    - name: Display container info
      debug:
        msg:
          - 'Container State: {{ container_info.exists }}'
          - 'Container Running: {{ container_info.container.State.Running }}'
          - 'Container Status: {{ container_info.container.State.Status }}'

    - name: Check database connectivity
      command: docker exec {{ docker_container_name }} pnpm db:migrate:status
      register: db_status
      failed_when: db_status.rc != 0
      changed_when: false

    - name: Health check summary
      debug:
        msg:
          - '✅ API is healthy'
          - '✅ Docker container is running'
          - '✅ Database connectivity verified'
          - 'Deployment validation successful!'
