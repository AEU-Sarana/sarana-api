---
# Stop Application Playbook

- name: Stop Stock POS Application
  hosts: app_servers
  become: yes
  gather_facts: no

  vars_prompt:
    - name: confirm_stop
      prompt: "Are you sure you want to stop all containers? (yes/no)"
      private: no
      default: "no"

  tasks:
    - name: Verify stop confirmation
      fail:
        msg: "Stop operation cancelled by user"
      when: confirm_stop != "yes"

    - name: Stop all containers
      docker_compose:
        project_src: "{{ app_directory }}"
        state: absent
        remove_volumes: no

    - name: Verify containers are stopped
      command: docker ps --filter "name={{ app_name }}" --format "{% raw %}{{.Names}}{% endraw %}"
      register: running_containers
      changed_when: false

    - name: Display status
      debug:
        msg: "All containers stopped successfully"
      when: running_containers.stdout == ""

    - name: Warning if containers still running
      debug:
        msg: "Warning: Some containers may still be running: {{ running_containers.stdout_lines }}"
      when: running_containers.stdout != ""