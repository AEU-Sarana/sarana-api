---
# Start Application Playbook

- name: Start Stock POS Application
  hosts: app_servers
  become: yes
  gather_facts: no

  pre_tasks:
    - name: Load production group variables
      include_vars:
        file: "{{ playbook_dir }}/../inventories/production/group_vars/prod.yml"

  tasks:
    - name: Start all containers
      docker_compose:
        project_src: "{{ app_directory }}"
        files:
          - docker-compose.yml
          - docker-compose.prod.yml
        state: present

    - name: Wait for services to be healthy
      command: docker compose -f {{ app_directory }}/docker-compose.yml -f {{ app_directory }}/docker-compose.prod.yml ps
      register: compose_ps
      until: compose_ps.stdout.find("(healthy)") != -1 or compose_ps.stdout.find("Up") != -1
      retries: 10
      delay: 5
      changed_when: false

    - name: Get running containers
      command: docker ps --filter "name={{ app_name }}" --format "table {% raw %}{{.Names}}\t{{.Status}}\t{{.Ports}}{% endraw %}"
      register: running_containers
      changed_when: false

    - name: Display running containers
      debug:
        msg: "{{ running_containers.stdout_lines }}"

    - name: Display success message
      debug:
        msg: "All containers started successfully!"