---
# ============================================================================
# Setup Server Infrastructure Playbook
# Purpose: Setup SSH keys, directory structure, and Docker for deployments
# Usage: ansible-playbook playbooks/setup.yml --ask-vault-pass
# ============================================================================

- name: Setup Server Infrastructure
  hosts: app_servers
  become: yes
  gather_facts: yes

  pre_tasks:
    - name: Load production group variables
      include_vars:
        file: "{{ playbook_dir }}/../inventories/production/group_vars/prod.yml"

    - name: Load vault variables
      include_vars:
        file: "{{ playbook_dir }}/../inventories/production/group_vars/vault.yml"

    - name: Display setup information
      debug:
        msg:
          - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          - "🚀 Server Setup: SSH Keys, Directory Structure & Docker"
          - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          - "Target Server: {{ inventory_hostname }}"
          - "IP Address: {{ ansible_host }}"
          - "Deployer User: {{ deployer_user }}"
          - "App Directory: {{ app_directory }}"
          - "Jenkins Key: {{ 'Configured' if vault_jenkins_public_key | default('') | length > 0 else 'NOT configured' }}"
          - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

  roles:
    - role: ssh-keys-setup
      tags: ['ssh', 'setup']

    - role: setup-structure
      tags: ['structure', 'setup']

    - role: docker-setup
      tags: ['docker', 'setup']

  post_tasks:
    - name: Ensure docker group membership is active
      shell: "newgrp docker"
      become: yes
      become_user: "{{ deployer_user }}"
      changed_when: false

    - name: Test Docker access for deployer user
      shell: "docker ps"
      become: yes
      become_user: "{{ deployer_user }}"
      register: docker_test
      changed_when: false

    - name: Display setup completion
      debug:
        msg:
          - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          - "✅ Server Setup Complete!"
          - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          - "User: {{ deployer_user }}"
          - "Home: {{ deployer_home }}"
          - "App Root: {{ app_directory }}"
          - "Docker Access: ✅ Working"
          - ""
          - "Test SSH access:"
          - "  ssh {{ deployer_user }}@{{ ansible_host }}"
          - ""
          - "Test Docker:"
          - "  ssh {{ deployer_user }}@{{ ansible_host }} 'docker ps'"
          - ""
          - "Test directory structure:"
          - "  ssh {{ deployer_user }}@{{ ansible_host }} 'ls -la {{ app_directory }}'"
          - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

    - name: Verify deployment user has proper permissions
      shell: |
        echo "Deployer user: $(id {{ deployer_user }})"
        echo "App directory permissions: $(ls -ld {{ app_directory }})"
        echo "Docker group: $(groups {{ deployer_user }})"
      register: verification
      changed_when: false

    - name: Display verification results
      debug:
        msg: "{{ verification.stdout_lines }}"
