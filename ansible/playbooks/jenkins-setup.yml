---
# Example playbook for Jenkins installation

- name: Install and Configure Jenkins with Java 21
  hosts: jenkins_servers
  become: yes
  
  vars:
    jenkins_port: 8080
    jenkins_admin_email: admin@example.com
  
  pre_tasks:
    - name: Ensure system is up to date
      apt:
        upgrade: dist
        update_cache: yes
      when: ansible_os_family == "Debian"
  
  roles:
    - jenkins
  
  post_tasks:
    - name: Display Jenkins access information
      debug:
        msg:
          - "=========================================="
          - "Jenkins Installation Complete!"
          - "=========================================="
          - "Access Jenkins at: http://{{ ansible_host }}:{{ jenkins_port }}"
          - "Check the output above for the initial admin password"
          - "=========================================="