---
# Main Deployment Playbook for {{ app_name }}
# This playbook deploys the Stock POS application with Docker

- name: Deploy Stock POS Application
  hosts: app_servers
  become: yes
  gather_facts: yes

  vars_prompt:
    - name: confirm_deploy_prompt
      prompt: "Are you sure you want to deploy? (yes/no)"
      private: no
      default: "no"

  pre_tasks:
    # Load production vars and vault first so all variables (nginx_http_port, db_*, vault_*) are available
    - name: Load production group variables
      include_vars:
        file: "{{ playbook_dir }}/../inventories/production/group_vars/all.yml"

    - name: Load vault variables (decrypted via --vault-password-file)
      include_vars:
        file: "{{ playbook_dir }}/../inventories/production/group_vars/vault.yml"

    - name: Set confirm_deploy if not provided
      set_fact:
        confirm_deploy: "{{ confirm_deploy | default('no') }}"
    
    - name: Use prompted value if available
      set_fact:
        confirm_deploy: "{{ confirm_deploy_prompt }}"
      when: confirm_deploy == "no" and confirm_deploy_prompt != "no"

    - name: Verify deployment confirmation
      fail:
        msg: "Deployment cancelled by user"
      when: confirm_deploy != "yes"

    - name: Display target server information
      debug:
        msg:
          - "Target Server: {{ inventory_hostname }}"
          - "IP Address: {{ ansible_host }}"
          - "Application: {{ app_name }}"
          - "Environment: {{ node_env }}"

    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

  roles:
    - role: docker
      tags: ['docker', 'setup']

    - role: app-deploy
      tags: ['app', 'deploy']

    # NOTE: Skipping nginx-letsencrypt role because:
    # - Docker nginx container handles HTTP/HTTPS on ports 80/443
    # - Cloudflare proxy handles HTTPS termination
    # - No need for host-level Let's Encrypt certificate
    # Uncomment if you need to use host-level nginx instead of Docker
    #- role: nginx-letsencrypt
    #  tags: ['nginx', 'ssl', 'letsencrypt']
    #  when: enable_ssl | default(true) | bool

  post_tasks:
    - name: Final deployment status
      debug:
        msg:
          - "======================================"
          - "Deployment completed successfully!"
          - "Application: {{ app_name }}"
          - "Server: {{ inventory_hostname }}"
          - "HTTP Access: http://{{ ansible_host }}"
          - "HTTPS Access: https://{{ subdomain }}.{{ domain }}"
          - "Container Nginx Port: {{ nginx_internal_port | default(8080) }}"
          - "======================================"

    - name: Verify all services are running
      command: docker ps --filter "name={{ app_name }}" --format "table {% raw %}{{.Names}}\t{{.Status}}{% endraw %}"
      register: final_services
      changed_when: false

    - name: Display running services
      debug:
        msg: "{{ final_services.stdout_lines }}"


