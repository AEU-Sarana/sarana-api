---
# Restrict node-exporter (9100) so only Jenkins server can scrape it.
# This uses DOCKER-USER iptables chain to filter Docker-published port traffic.

- name: Secure Node Exporter Access
  hosts: app_servers
  become: true
  gather_facts: true

  pre_tasks:
    - name: Load production group variables
      include_vars:
        file: "{{ playbook_dir }}/../inventories/production/group_vars/all.yml"

    - name: Validate node exporter is enabled
      assert:
        that:
          - node_exporter_enabled | bool
        fail_msg: "node_exporter_enabled must be true before applying firewall restrictions."

    - name: Validate allowed source IP format
      assert:
        that:
          - node_exporter_allowed_source_ip is defined
          - node_exporter_allowed_source_ip | trim | length > 0
          - node_exporter_allowed_source_ip is match('^([0-9]{1,3}\\.){3}[0-9]{1,3}$')
        fail_msg: "node_exporter_allowed_source_ip must be a valid IPv4 address."

  tasks:
    - name: Ensure iptables rule allows Jenkins IP to node exporter port
      shell: >-
        iptables -C DOCKER-USER -p tcp -s {{ node_exporter_allowed_source_ip }}
        --dport {{ node_exporter_port }} -j ACCEPT ||
        iptables -I DOCKER-USER 1 -p tcp -s {{ node_exporter_allowed_source_ip }}
        --dport {{ node_exporter_port }} -j ACCEPT
      register: allow_rule
      changed_when: allow_rule.rc == 0

    - name: Ensure iptables rule denies other sources to node exporter port
      shell: >-
        iptables -C DOCKER-USER -p tcp --dport {{ node_exporter_port }} -j DROP ||
        iptables -A DOCKER-USER -p tcp --dport {{ node_exporter_port }} -j DROP
      register: deny_rule
      changed_when: deny_rule.rc == 0

    - name: Ensure iptables persistent package is installed
      apt:
        name: iptables-persistent
        state: present
        update_cache: true
      environment:
        DEBIAN_FRONTEND: noninteractive

    - name: Persist firewall rules
      command: netfilter-persistent save
      changed_when: true

    - name: Show effective node exporter firewall rules
      command: iptables -S DOCKER-USER
      register: docker_user_rules
      changed_when: false

    - name: Display firewall summary
      debug:
        msg:
          - "Node exporter port: {{ node_exporter_port }}"
          - "Allowed source: {{ node_exporter_allowed_source_ip }}"
          - "Rules:"
          - "{{ docker_user_rules.stdout_lines }}"
