---
# Rollback Playbook (tag-based)
# Re-deploys a previous container image tag using the existing app-deploy role.

- name: Rollback Stock POS Application
  hosts: app_servers
  become: true
  gather_facts: true

  vars_prompt:
    - name: rollback_tag
      prompt: "Enter image tag to rollback to (example: 10-2829db0)"
      private: false

    - name: confirm_rollback
      prompt: "Confirm rollback to this tag? (yes/no)"
      private: false
      default: "no"

  pre_tasks:
    - name: Load production group variables
      include_vars:
        file: "{{ playbook_dir }}/../inventories/production/group_vars/all.yml"

    - name: Load vault variables (decrypted via --vault-password-file)
      include_vars:
        file: "{{ playbook_dir }}/../inventories/production/group_vars/vault.yml"

    - name: Verify rollback confirmation
      fail:
        msg: "Rollback cancelled by user"
      when: confirm_rollback != "yes"

    - name: Validate rollback tag format
      assert:
        that:
          - rollback_tag is defined
          - rollback_tag | trim | length > 0
          - rollback_tag is match('^[A-Za-z0-9._-]+$')
        fail_msg: "Invalid rollback_tag. Use only letters, numbers, dot, underscore, dash."

    - name: Detect currently running app image
      shell: docker inspect --format='{{ "{{" }}.Config.Image{{ "}}" }}' "{{ app_name }}-app"
      register: current_image
      changed_when: false
      failed_when: false

    - name: Derive current tag
      set_fact:
        current_tag: "{{ (current_image.stdout | trim).split(':')[-1] if current_image.rc == 0 else 'unknown' }}"

    - name: Display rollback plan
      debug:
        msg:
          - "Target server: {{ inventory_hostname }} ({{ ansible_host }})"
          - "Current tag: {{ current_tag }}"
          - "Rollback tag: {{ rollback_tag }}"
          - "Image: {{ docker_registry }}/{{ docker_registry_username | lower }}/{{ docker_image_name }}"

    - name: Enforce rollback deployment flags
      set_fact:
        build_image: false
        pull_images: true
        force_recreate: true
        run_db_migrations: false
        run_db_seed: false
        docker_image_tag: "{{ rollback_tag }}"

  roles:
    - role: app-deploy

  post_tasks:
    - name: Wait for app health endpoint after rollback
      uri:
        url: "http://127.0.0.1:{{ app_port }}/api/health"
        status_code: 200
      register: rollback_health
      retries: 12
      delay: 10
      until: rollback_health.status == 200

    - name: Verify container health status is healthy
      shell: docker inspect --format='{{ "{{" }}if .State.Health{{ "}}" }}{{ "{{" }}.State.Health.Status{{ "}}" }}{{ "{{" }}else{{ "}}" }}unknown{{ "{{" }}end{{ "}}" }}' "{{ app_name }}-app"
      register: container_health
      changed_when: false
      retries: 12
      delay: 5
      until: container_health.stdout | trim == "healthy"

    - name: Ensure release log directory exists
      file:
        path: "{{ app_directory }}"
        state: directory
        mode: "0755"

    - name: Record rollback event
      lineinfile:
        path: "{{ app_directory }}/release-history.log"
        create: true
        mode: "0644"
        line: >-
          {{ ansible_date_time.iso8601 }} action=rollback app={{ app_name }}
          from={{ current_tag }} to={{ rollback_tag }}
          status=success host={{ inventory_hostname }}

    - name: Display rollback summary
      debug:
        msg:
          - "======================================"
          - "Rollback completed successfully"
          - "App: {{ app_name }}"
          - "Host: {{ inventory_hostname }}"
          - "From tag: {{ current_tag }}"
          - "To tag: {{ rollback_tag }}"
          - "Health endpoint: OK"
          - "Container health: {{ container_health.stdout | trim }}"
          - "======================================"
