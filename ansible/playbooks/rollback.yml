---
# Rollback Playbook
# This playbook rolls back to a previous backup

- name: Rollback Stock POS Application
  hosts: app_servers
  become: yes
  gather_facts: yes

  pre_tasks:
    - name: Load production group variables
      include_vars:
        file: "{{ playbook_dir }}/../inventories/production/group_vars/prod.yml"

  vars_prompt:
    - name: backup_timestamp
      prompt: "Enter backup timestamp to restore (format: YYYYMMDD_HHMMSS) or 'latest'"
      private: no
      default: "latest"

    - name: confirm_rollback
      prompt: "Are you sure you want to rollback? This will stop current containers. (yes/no)"
      private: no
      default: "no"

  tasks:
    - name: Verify rollback confirmation
      fail:
        msg: "Rollback cancelled by user"
      when: confirm_rollback != "yes"

    - name: List available backups
      find:
        paths: "{{ backup_directory }}"
        patterns: "backup_*.tar.gz"
      register: available_backups

    - name: Display available backups
      debug:
        msg: "{{ available_backups.files | map(attribute='path') | list }}"

    - name: Fail if no backups available
      fail:
        msg: "No backups found in {{ backup_directory }}"
      when: available_backups.matched == 0

    - name: Determine backup file to restore
      set_fact:
        restore_file: "{{ available_backups.files | sort(attribute='mtime', reverse=true) | first | json_query('path') }}"
      when: backup_timestamp == "latest"

    - name: Use specified backup
      set_fact:
        restore_file: "{{ backup_directory }}/backup_{{ backup_timestamp }}.tar.gz"
      when: backup_timestamp != "latest"

    - name: Verify backup file exists
      stat:
        path: "{{ restore_file }}"
      register: backup_stat

    - name: Fail if backup doesn't exist
      fail:
        msg: "Backup file {{ restore_file }} does not exist"
      when: not backup_stat.stat.exists

    - name: Stop current containers
      docker_compose:
        project_src: "{{ app_directory }}"
        state: absent

    - name: Create pre-rollback backup
      shell: |
        TIMESTAMP=$(date +%Y%m%d_%H%M%S)
        tar -czf {{ backup_directory }}/pre_rollback_${TIMESTAMP}.tar.gz -C {{ app_directory }} .
      changed_when: false

    - name: Clear current deployment
      file:
        path: "{{ app_directory }}"
        state: absent

    - name: Recreate application directory
      file:
        path: "{{ app_directory }}"
        state: directory
        owner: "{{ app_user }}"
        mode: '0755'

    - name: Restore backup
      unarchive:
        src: "{{ restore_file }}"
        dest: "{{ app_directory }}"
        remote_src: yes
        owner: "{{ app_user }}"

    - name: Start containers from restored backup
      docker_compose:
        project_src: "{{ app_directory }}"
        state: present

    - name: Wait for services to be ready
      command: docker compose -f {{ app_directory }}/docker-compose.yml ps
      register: compose_ps
      until: compose_ps.stdout.find("Up") != -1
      retries: 10
      delay: 5
      changed_when: false

    - name: Display rollback summary
      debug:
        msg:
          - "======================================"
          - "Rollback completed successfully!"
          - "Restored from: {{ restore_file }}"
          - "Application: {{ app_name }}"
          - "======================================"