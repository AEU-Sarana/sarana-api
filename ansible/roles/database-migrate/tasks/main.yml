---
# Database migration tasks
- name: Check if migrations should run
  debug:
    msg: 'Running database migrations: {{ run_migrations | default(false) }}'

- name: Run database migrations
  docker_container:
    name: '{{ docker_container_name }}-migrate'
    image: '{{ docker_image }}'
    state: started
    auto_remove: yes
    networks:
      - name: '{{ docker_network }}'
    env:
      NODE_ENV: '{{ app_env }}'
      DATABASE_URL: 'postgresql://{{ postgres_user }}:{{ postgres_password }}@{{ postgres_host }}:{{ postgres_port }}/{{ postgres_db }}'
    command: 'pnpm db:migrate:deploy'
  when: run_migrations | default(false) | bool
  register: migration_result
  changed_when: "'No pending migrations' not in migration_result.stdout"

- name: Wait for migrations to complete
  docker_container_info:
    name: '{{ docker_container_name }}-migrate'
  register: migration_container
  until: migration_container.container.State.Running == false
  retries: 30
  delay: 5
  when: run_migrations | default(false) | bool

- name: Check migration status
  shell: 'docker exec {{ docker_container_name }} pnpm db:migrate:status'
  register: migration_status
  changed_when: false
  when: run_migrations | default(false) | bool

- name: Display migration results
  debug:
    msg: '{{ migration_status.stdout_lines }}'
  when: run_migrations | default(false) | bool

- name: Migration skipped notification
  debug:
    msg: '⚠️  Database migrations skipped (run_migrations=false)'
  when: not (run_migrations | default(false) | bool)
