---
# Default variables for Ansible deployment
# Override these in inventory or group_vars for each environment

# Application
app_version: 'latest'
environment: 'development'
app_env: 'development'
docker_container_name: stock-pos-app
docker_network: stock-pos-network
deploy_path: /opt/stock-pos-server

# Docker Registry
docker_registry: 'registry.example.com'
docker_registry_user: ''
docker_registry_password: ''
docker_image: '{{ docker_registry }}/stock-pos-server:{{ app_version }}'

# Application Port
app_port: 3000

# Database Configuration
postgres_user: 'postgres'
postgres_password: 'postgres'
postgres_host: 'db.example.com'
postgres_port: 5432
postgres_db: 'stock_pos'

# Redis Configuration
redis_host: 'redis.example.com'
redis_port: 6379

# JWT Secrets (MUST be set in production!)
jwt_secret: "{{ vault_jwt_secret | default('change-me-in-production') }}"
jwt_refresh_secret: "{{ vault_jwt_refresh_secret | default('change-me-in-production') }}"

# CORS Configuration
allowed_origins: 'http://localhost:3000'

# Email Configuration (Optional)
smtp_host: ''
smtp_port: 587
smtp_user: ''
smtp_pass: ''
smtp_from: 'noreply@stockpos.com'

# Migration Control
run_migrations: false
migration_timeout: 300

# Resource Limits
docker_cpu_limit: '1'
docker_memory_limit: '1G'
docker_cpu_reservation: '0.5'
docker_memory_reservation: '512M'

# Health Check Configuration
health_check_interval: 30
health_check_timeout: 10
health_check_retries: 3
health_check_start_period: 40

# Deployment Strategy
restart_policy: 'unless-stopped'
deployment_user: 'deploy'
deployment_group: 'deploy'
