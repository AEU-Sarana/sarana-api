---
- name: Ensure application directory exists
  file:
    path: "{{ app_directory }}"
    state: directory
    owner: "{{ app_user }}"
    mode: '0755'

- name: Ensure backup directory exists
  file:
    path: "{{ backup_directory }}"
    state: directory
    owner: "{{ app_user }}"
    mode: '0755'
  when: backup_enabled | bool

- name: Create backup of current deployment
  shell: |
    TIMESTAMP=$(date +%Y%m%d_%H%M%S)
    tar -czf {{ backup_directory }}/backup_${TIMESTAMP}.tar.gz -C {{ app_directory }} . 2>/dev/null || true
  when: 
    - backup_enabled | bool
    - ansible_check_mode == false
  changed_when: false
  ignore_errors: yes

- name: Keep only last 5 backups
  shell: |
    cd {{ backup_directory }}
    ls -t backup_*.tar.gz | tail -n +6 | xargs -r rm --
  when: backup_enabled | bool
  changed_when: false
  ignore_errors: yes

- name: Check if application directory has content
  find:
    paths: "{{ app_directory }}"
    file_type: any
  register: app_dir_contents

- name: Display deployment information
  debug:
    msg:
      - "Deploying {{ app_name }}"
      - "Directory: {{ app_directory }}"
      - "Branch: {{ app_branch }}"
      - "Build image: {{ build_image }}"

- name: Check active color state file
  stat:
    path: "{{ active_color_state_file }}"
  register: active_color_state_stat
  when: blue_green_enabled | bool

- name: Read active color state file
  slurp:
    src: "{{ active_color_state_file }}"
  register: active_color_state_raw
  when:
    - blue_green_enabled | bool
    - active_color_state_stat.stat.exists | default(false)

- name: Resolve active color
  set_fact:
    active_color: >-
      {{
        (((active_color_state_raw | default({})).get('content', '') | b64decode | trim))
        if ((((active_color_state_raw | default({})).get('content', '') | b64decode | trim) in ['blue', 'green']))
        else active_color_default
      }}
  when: blue_green_enabled | bool

- name: Resolve deployment target color and service
  set_fact:
    deploy_color: "{{ 'green' if active_color == 'blue' else 'blue' }}"
    active_service_name: "app-{{ active_color }}"
    deploy_service_name: "app-{{ 'green' if active_color == 'blue' else 'blue' }}"
    deploy_host_port: "{{ green_app_port if active_color == 'blue' else blue_app_port }}"
    active_host_port: "{{ blue_app_port if active_color == 'blue' else green_app_port }}"
    app_runtime_service: "app-{{ 'green' if active_color == 'blue' else 'blue' }}"
  when: blue_green_enabled | bool

- name: Detect current active app image
  shell: >-
    docker inspect --format='{{ "{{" }}.Config.Image{{ "}}" }}'
    "{{ app_name }}-app-{{ active_color }}"
  register: active_app_image
  changed_when: false
  failed_when: false
  when: blue_green_enabled | bool

- name: Resolve current active app image tag
  set_fact:
    current_active_image_tag: >-
      {{
        ((active_app_image.stdout | trim).split(':')[-1])
        if (active_app_image is defined and active_app_image.rc == 0 and (active_app_image.stdout | trim | length > 0))
        else docker_image_tag
      }}
  when: blue_green_enabled | bool

- name: Resolve per-color image tags for true blue/green
  set_fact:
    app_blue_image_tag: "{{ current_active_image_tag if active_color == 'blue' else docker_image_tag }}"
    app_green_image_tag: "{{ current_active_image_tag if active_color == 'green' else docker_image_tag }}"
  when: blue_green_enabled | bool

- name: Use single-service mode facts
  set_fact:
    active_service_name: "app"
    deploy_service_name: "app"
    app_runtime_service: "app"
    active_host_port: "{{ app_port }}"
    deploy_host_port: "{{ app_port }}"
    app_blue_image_tag: "{{ docker_image_tag }}"
    app_green_image_tag: "{{ docker_image_tag }}"
  when: not (blue_green_enabled | bool)

- name: Display blue/green deployment plan
  debug:
    msg:
      - "Active color: {{ active_color }}"
      - "Deploy color: {{ deploy_color }}"
      - "Active service: {{ active_service_name }}"
      - "Deploy service: {{ deploy_service_name }}"
      - "Deploy port: {{ deploy_host_port }}"
      - "Active tag (kept): {{ current_active_image_tag }}"
      - "Deploy tag (new): {{ docker_image_tag }}"
  when: blue_green_enabled | bool
