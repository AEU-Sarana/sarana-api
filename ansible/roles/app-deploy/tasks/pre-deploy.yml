---
- name: Ensure application directory exists
  file:
    path: "{{ app_directory }}"
    state: directory
    owner: "{{ app_user }}"
    mode: '0755'

- name: Ensure backup directory exists
  file:
    path: "{{ backup_directory }}"
    state: directory
    owner: "{{ app_user }}"
    mode: '0755'
  when: backup_enabled | bool

- name: Create backup of current deployment
  shell: |
    TIMESTAMP=$(date +%Y%m%d_%H%M%S)
    tar -czf {{ backup_directory }}/backup_${TIMESTAMP}.tar.gz -C {{ app_directory }} . 2>/dev/null || true
  when: 
    - backup_enabled | bool
    - ansible_check_mode == false
  changed_when: false
  ignore_errors: yes

- name: Keep only last 5 backups
  shell: |
    cd {{ backup_directory }}
    ls -t backup_*.tar.gz | tail -n +6 | xargs -r rm --
  when: backup_enabled | bool
  changed_when: false
  ignore_errors: yes

- name: Check if application directory has content
  find:
    paths: "{{ app_directory }}"
    file_type: any
  register: app_dir_contents

- name: Display deployment information
  debug:
    msg:
      - "Deploying {{ app_name }}"
      - "Directory: {{ app_directory }}"
      - "Branch: {{ app_branch }}"
      - "Build image: {{ build_image }}"