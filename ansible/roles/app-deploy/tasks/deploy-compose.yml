---
# Clean up old Docker networks before deploying
- name: Copy network cleanup script
  copy:
    src: ../../scripts/cleanup-docker-networks.sh
    dest: "{{ app_directory }}/cleanup-docker-networks.sh"
    mode: '0755'
  become: yes

- name: Run Docker network cleanup
  command: bash {{ app_directory }}/cleanup-docker-networks.sh {{ app_name }}
  register: cleanup_output
  changed_when: false
  become: yes

- name: Display network cleanup output
  debug:
    msg: "{{ cleanup_output.stdout_lines }}"

- name: Verify Docker registry credentials are provided
  assert:
    that:
      - docker_registry is defined
      - docker_registry_username is defined
      - docker_registry_password is defined
    fail_msg: "Docker registry credentials not provided. Cannot pull private images from {{ docker_registry | default('registry') }}"
    success_msg: "Docker registry credentials verified for {{ docker_registry }}"
  when: pull_images | bool

- name: Login to Docker registry (GHCR)
  shell: |
    echo "{{ docker_registry_password }}" | docker login {{ docker_registry }} -u "{{ docker_registry_username }}" --password-stdin
  register: docker_login_result
  changed_when: false
  failed_when: docker_login_result.rc != 0
  no_log: true

- name: Verify Docker login was successful
  debug:
    msg: "Successfully authenticated to {{ docker_registry }} as {{ docker_registry_username }}"
  when: docker_login_result is defined and docker_login_result.rc == 0

- name: Stop existing containers (if force recreate)
  community.docker.docker_compose_v2:
    project_src: "{{ app_directory }}"
    state: absent
  when: force_recreate | bool
  ignore_errors: true

- name: Pull Docker images from registry
  community.docker.docker_compose_v2:
    project_src: "{{ app_directory }}"
    pull: always
  when: 
    - pull_images | bool
    - not (build_image | bool)

- name: Deploy application with Docker Compose
  community.docker.docker_compose_v2:
    project_src: "{{ app_directory }}"
    files:
      - docker-compose.yml
      - docker-compose.prod.yml
    services:
      - db
      - redis
{% if (storage_provider | default('minio') | lower) == 'minio' %}
      - minio
{% endif %}
      - node-exporter
      - nginx
      - "{{ deploy_service_name }}"
    state: present
    pull: "{{ 'always' if pull_images | bool else 'never' }}"
    build: "{{ 'always' if build_image | bool else 'never' }}"
    recreate: "{{ 'always' if force_recreate else 'auto' }}"
  register: compose_output
  when: blue_green_enabled | bool

- name: Deploy application with Docker Compose (single service mode)
  community.docker.docker_compose_v2:
    project_src: "{{ app_directory }}"
    files:
      - docker-compose.yml
      - docker-compose.prod.yml
    state: present
    pull: "{{ 'always' if pull_images | bool else 'never' }}"
    build: "{{ 'always' if build_image | bool else 'never' }}"
    recreate: "{{ 'always' if force_recreate else 'auto' }}"
  register: compose_output
  when: not (blue_green_enabled | bool)

- name: Display Docker Compose output
  debug:
    var: compose_output
  when: compose_output is changed

# MOVED UP - Wait for services BEFORE running migrationsss
- name: Wait for services to be healthy
  command: docker compose -f {{ app_directory }}/docker-compose.yml -f {{ app_directory }}/docker-compose.prod.yml ps
  register: compose_ps
  until: compose_ps.stdout.find("(healthy)") != -1 or compose_ps.stdout.find("Up") != -1
  retries: 10
  delay: 5
  changed_when: false
  ignore_errors: true

- name: Wait for target app container health
  shell: >
    docker inspect --format='{{ "{{" }}if .State.Health{{ "}}" }}{{ "{{" }}.State.Health.Status{{ "}}" }}{{ "{{" }}else{{ "}}" }}unknown{{ "{{" }}end{{ "}}" }}'
    "{{ app_name }}-app{{ '-' + deploy_color if blue_green_enabled | bool else '' }}"
  register: target_app_health
  changed_when: false
  retries: 30
  delay: 5
  until: target_app_health.stdout | trim == "healthy"

# ADDED - Wait specifically for database to be ready
- name: Wait for database to accept connections
  shell: |
    docker compose -f {{ app_directory }}/docker-compose.yml \
    -f {{ app_directory }}/docker-compose.prod.yml \
    exec -T db pg_isready -U stockpos -d stock_pos
  register: db_ready
  until: db_ready.rc == 0
  retries: 30
  delay: 2
  changed_when: false
  when: run_db_migrations | bool
  ignore_errors: false

# ADDED - Verify app container is running
- name: Verify app container is running
  shell: |
    docker compose -f {{ app_directory }}/docker-compose.yml \
    -f {{ app_directory }}/docker-compose.prod.yml \
    ps {{ app_runtime_service }} --format json
  register: app_status
  changed_when: false
  when: run_db_migrations | bool

- name: Display app container status
  debug:
    var: app_status.stdout
  when: run_db_migrations | bool

# Wait for database to be fully ready
- name: Wait for database to be accessible
  command: >-
    docker compose -f {{ app_directory }}/docker-compose.yml
    -f {{ app_directory }}/docker-compose.prod.yml
    exec -T db psql -U {{ db_user }} -d {{ db_name }} -c "SELECT 1"
  environment:
    PGPASSWORD: "{{ db_password }}"
  register: db_check
  changed_when: false
  retries: 10
  delay: 3
  until: db_check.rc == 0
  when: run_db_migrations | bool

# Ensure database password is synced (PostgreSQL only sets password during initial creation)
- name: Update database user password to match configuration
  shell: >-
    docker compose -f {{ app_directory }}/docker-compose.yml
    -f {{ app_directory }}/docker-compose.prod.yml
    exec -T db psql -U {{ db_user }} -c "ALTER USER {{ db_user }} WITH PASSWORD '{{ db_password }}';"
  environment:
    PGPASSWORD: "{{ db_password }}"
  register: password_update
  changed_when: false
  failed_when: false
  when: run_db_migrations | bool

- name: Display .env file for debugging
  command: cat {{ app_directory }}/.env
  register: env_file_content
  changed_when: false
  when: run_db_migrations | bool

- name: Show database configuration
  debug:
    msg: |
      DB_USER: {{ db_user }}
      DB_PASSWORD: {{ db_password | default('NOT_SET') }}
      DB_NAME: {{ db_name }}
      DB_HOST: {{ db_host }}
      DATABASE_URL will be: postgresql://{{ db_user }}:{{ db_password | default('') }}@{{ db_host }}:5432/{{ db_name }}
  when: run_db_migrations | bool

- name: Check app container environment
  shell: >-
    docker compose -f {{ app_directory }}/docker-compose.yml
    -f {{ app_directory }}/docker-compose.prod.yml
    exec -T {{ app_runtime_service }} printenv | grep -i database || echo "DATABASE_URL not found"
  register: app_env
  changed_when: false
  failed_when: false
  when: run_db_migrations | bool

- name: Show app environment (DATABASE_URL)
  debug:
    var: app_env.stdout_lines
  when: run_db_migrations | bool

# NOW run migrations after everything is ready
- name: Run database migrations (domain-based)
  command: >-
    docker compose -f {{ app_directory }}/docker-compose.yml
    -f {{ app_directory }}/docker-compose.prod.yml
    exec -T {{ app_runtime_service }} pnpm migrate:apply
  register: migrate_output
  changed_when: "'Applied' in migrate_output.stdout or 'migrate' in migrate_output.stdout or 'Success' in migrate_output.stdout"
  failed_when: migrate_output.rc != 0
  retries: 3
  delay: 5
  when: run_db_migrations | bool

- name: Display migration output
  debug:
    var: migrate_output.stdout_lines
  when: run_db_migrations | bool and migrate_output is defined

- name: Run database seed
  command: >-
    docker compose -f {{ app_directory }}/docker-compose.yml
    -f {{ app_directory }}/docker-compose.prod.yml
    exec -T {{ app_runtime_service }} pnpm seed
  register: seed_output
  changed_when: "'seed' in seed_output.stdout or seed_output.rc == 0"
  failed_when: seed_output.rc != 0
  retries: 3
  delay: 5
  when: run_db_seed | bool

- name: Display seed output
  debug:
    var: seed_output.stdout_lines
  when: run_db_seed | bool and seed_output is defined

- name: Switch active color after successful deploy
  set_fact:
    previous_active_color: "{{ active_color }}"
    active_color: "{{ deploy_color }}"
    active_service_name: "app-{{ deploy_color }}"
    active_host_port: "{{ deploy_host_port }}"
  when: blue_green_enabled | bool

- name: Update container nginx upstream to new active color
  template:
    src: nginx-default.conf.j2
    dest: "{{ app_directory }}/docker/nginx/conf.d/default.conf"
    owner: "{{ app_user }}"
    mode: "0644"
    force: yes
  when: blue_green_enabled | bool

- name: Reload container nginx
  command: >-
    docker compose -f {{ app_directory }}/docker-compose.yml
    -f {{ app_directory }}/docker-compose.prod.yml
    exec -T nginx nginx -s reload
  when: blue_green_enabled | bool

- name: Persist active color state
  copy:
    dest: "{{ active_color_state_file }}"
    content: "{{ active_color }}\n"
    owner: "{{ app_user }}"
    mode: "0644"
  when: blue_green_enabled | bool

- name: Remove legacy single-service app container if present
  command: docker rm -f {{ app_name }}-app
  register: remove_legacy_app
  changed_when: remove_legacy_app.rc == 0
  failed_when: false
  when: blue_green_enabled | bool

- name: Get running containers
  command: docker ps --filter "name={{ app_name }}" --format "table {% raw %}{{.Names}}\t{{.Status}}\t{{.Ports}}{% endraw %}"
  register: running_containers
  changed_when: false

- name: Display running containers
  debug:
    msg: "{{ running_containers.stdout_lines }}"
