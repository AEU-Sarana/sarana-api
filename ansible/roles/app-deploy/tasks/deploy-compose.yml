---
- name: Verify Docker registry credentials are provided
  assert:
    that:
      - docker_registry is defined
      - docker_registry_username is defined
      - docker_registry_password is defined
    fail_msg: "Docker registry credentials not provided. Cannot pull private images from {{ docker_registry | default('registry') }}"
    success_msg: "Docker registry credentials verified for {{ docker_registry }}"
  when: pull_images | bool

- name: Login to Docker registry (GHCR)
  shell: |
    echo "{{ docker_registry_password }}" | docker login {{ docker_registry }} -u "{{ docker_registry_username }}" --password-stdin
  register: docker_login_result
  changed_when: false
  failed_when: docker_login_result.rc != 0
  no_log: yes

- name: Verify Docker login was successful
  debug:
    msg: "Successfully authenticated to {{ docker_registry }} as {{ docker_registry_username }}"
  when: docker_login_result is defined and docker_login_result.rc == 0

- name: Stop existing containers (if force recreate)
  community.docker.docker_compose_v2:
    project_src: "{{ app_directory }}"
    state: absent
  when: force_recreate | bool
  ignore_errors: yes

- name: Pull Docker images from registry
  community.docker.docker_compose_v2:
    project_src: "{{ app_directory }}"
    pull: always
  when: 
    - pull_images | bool
    - not (build_image | bool)

- name: Deploy application with Docker Compose
  community.docker.docker_compose_v2:
    project_src: "{{ app_directory }}"
    files:
      - docker-compose.yml
      - docker-compose.prod.yml
    state: present
    pull: "{{ 'always' if pull_images | bool else 'never' }}"
    build: "{{ 'always' if build_image | bool else 'never' }}"
    recreate: "{{ 'always' if force_recreate else 'auto' }}"
  register: compose_output

- name: Display Docker Compose output
  debug:
    var: compose_output
  when: compose_output is changed

- name: Wait for services to be healthy
  command: docker compose -f {{ app_directory }}/docker-compose.yml -f {{ app_directory }}/docker-compose.prod.yml ps
  register: compose_ps
  until: compose_ps.stdout.find("(healthy)") != -1 or compose_ps.stdout.find("Up") != -1
  retries: 10
  delay: 5
  changed_when: false
  ignore_errors: yes

- name: Get running containers
  command: docker ps --filter "name={{ app_name }}" --format "table {% raw %}{{.Names}}\t{{.Status}}\t{{.Ports}}{% endraw %}"
  register: running_containers
  changed_when: false

- name: Display running containers
  debug:
    msg: "{{ running_containers.stdout_lines }}"