---
- name: application updated
  debug:
    msg: "Application code has been updated"

- name: environment updated
  debug:
    msg: "Environment variables have been updated"

- name: compose file updated
  debug:
    msg: "Docker Compose configuration has been updated"

- name: restart application
  community.docker.docker_compose_v2:
    project_src: "{{ app_directory }}"
    state: restarted
  listen: "restart app"