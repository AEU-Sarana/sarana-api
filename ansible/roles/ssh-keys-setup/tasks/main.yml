---
# roles/ssh-keys-setup/tasks/main.yml

- name: Display SSH keys setup information
  debug:
    msg:
      - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
      - "🔑 Setting up SSH keys for server access"
      - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
      - "User: {{ deploy_user }}"
      - "Jenkins key: {{ 'Enabled' if jenkins_public_key | default('') | length > 0 else 'Not configured' }}"
      - "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

- name: Ensure deployer user exists
  user:
    name: "{{ deploy_user }}"
    shell: /bin/bash
    create_home: yes
    state: present
  become: yes

- name: Add deployer to sudo and docker groups
  user:
    name: "{{ deploy_user }}"
    groups: "{{ item }}"
    append: yes
  become: yes
  loop:
    - sudo
    - docker
  ignore_errors: yes  # Docker group may not exist yet if Docker hasn't been installed

- name: Ensure .ssh directory exists
  file:
    path: "/home/{{ deploy_user }}/.ssh"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_group }}"
    mode: '0700'
  become: yes

# ✅ IMPORTANT FIX
- name: Ensure authorized_keys file exists
  file:
    path: "/home/{{ deploy_user }}/.ssh/authorized_keys"
    state: touch
    owner: "{{ deploy_user }}"
    group: "{{ deploy_group }}"
    mode: '0600'
  become: yes

- name: Add Jenkins public key
  authorized_key:
    user: "{{ deploy_user }}"
    key: "{{ jenkins_public_key }}"
    comment: "Jenkins CI Server"
    state: present
  become: yes
  when: jenkins_public_key | default('') | length > 0

- name: Add additional SSH keys
  authorized_key:
    user: "{{ deploy_user }}"
    key: "{{ item.key }}"
    comment: "{{ item.comment | default('Additional key') }}"
    state: present
  become: yes
  loop: "{{ additional_ssh_keys }}"
  when: additional_ssh_keys is defined and additional_ssh_keys | length > 0

# ❌ REMOVED "Set proper permissions" (already handled above)

- name: Verify keys count
  shell: grep -c "ssh-" /home/{{ deploy_user }}/.ssh/authorized_keys || echo "0"
  register: key_count
  changed_when: false

- name: Display setup summary
  debug:
    msg:
      - "✅ SSH Keys Setup Complete!"
      - "Total keys: {{ key_count.stdout }}"
      - "Test: ssh {{ deploy_user }}@{{ ansible_host }}"


