---
# SSH Keys Setup Role Defaults
# SSH public keys MUST be defined in vault.yml for security

# User to setup SSH keys for (inherits from group_vars)
deploy_user: "{{ deployer_user }}"
deploy_group: "{{ deployer_user }}"

# Jenkins SSH public key (REQUIRED: must be set in vault.yml)
jenkins_public_key: "{{ vault_jenkins_public_key | default('') }}"

# Additional SSH keys (REQUIRED: must be set in vault.yml)
additional_ssh_keys: "{{ vault_additional_ssh_keys | default([]) }}"
