---
# tasks file for jenkins role

- name: Update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600
  when: ansible_os_family == "Debian"

- name: Install required dependencies
  apt:
    name:
      - wget
      - gnupg2
      - software-properties-common
      - apt-transport-https
      - ca-certificates
      - curl
    state: present
  when: ansible_os_family == "Debian"

- name: Install Java 21
  apt:
    name: openjdk-21-jdk
    state: present
  when: ansible_os_family == "Debian"

- name: Verify Java installation
  command: java -version
  register: java_version
  changed_when: false

- name: Display Java version
  debug:
    var: java_version.stderr_lines

- name: Add Jenkins GPG key
  apt_key:
    url: https://pkg.jenkins.io/debian-stable/jenkins.io-2023.key
    state: present
  when: ansible_os_family == "Debian"

- name: Add Jenkins repository
  apt_repository:
    repo: "deb https://pkg.jenkins.io/debian-stable binary/"
    state: present
    filename: jenkins
  when: ansible_os_family == "Debian"

- name: Update apt cache after adding Jenkins repo
  apt:
    update_cache: yes
  when: ansible_os_family == "Debian"

- name: Install Jenkins
  apt:
    name: jenkins
    state: present
  when: ansible_os_family == "Debian"

- name: Ensure Jenkins service is started and enabled
  systemd:
    name: jenkins
    state: started
    enabled: yes

- name: Wait for Jenkins to start
  wait_for:
    port: "{{ jenkins_port }}"
    delay: 10
    timeout: 300

- name: Get Jenkins initial admin password
  slurp:
    src: /var/lib/jenkins/secrets/initialAdminPassword
  register: jenkins_initial_password
  ignore_errors: yes

- name: Display Jenkins initial admin password
  debug:
    msg: "Jenkins initial admin password: {{ jenkins_initial_password.content | b64decode }}"
  when: jenkins_initial_password is succeeded

- name: Configure Jenkins to use Java 21
  lineinfile:
    path: /etc/default/jenkins
    regexp: '^JAVA_HOME='
    line: 'JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64'
    create: yes
  notify: restart jenkins

- name: Set Jenkins URL in configuration
  lineinfile:
    path: /etc/default/jenkins
    regexp: '^JENKINS_ARGS='
    line: 'JENKINS_ARGS="--httpPort={{ jenkins_port }}"'
  notify: restart jenkins

# ===== Node.js Setup for Jenkins =====
- name: Check if Node.js is installed
  command: node --version
  register: node_check
  ignore_errors: yes
  changed_when: false
  tags: ['nodejs', 'jenkins-nodejs']

- name: Install Node.js 20.x
  block:
    - name: Download NodeSource setup script
      get_url:
        url: https://deb.nodesource.com/setup_20.x
        dest: /tmp/node_setup.sh
        mode: '0755'
      when: ansible_os_family == "Debian"

    - name: Run NodeSource setup script
      shell: bash /tmp/node_setup.sh
      register: nodesource_setup
      when: ansible_os_family == "Debian"

    - name: Update apt cache
      apt:
        update_cache: yes
      when: ansible_os_family == "Debian"

    - name: Install Node.js
      apt:
        name: nodejs
        state: present
      when: ansible_os_family == "Debian"

    - name: Clean up setup script
      file:
        path: /tmp/node_setup.sh
        state: absent
  when: node_check.rc != 0
  tags: ['nodejs', 'jenkins-nodejs']

- name: Verify Node.js installation
  command: node --version
  register: node_version
  changed_when: false
  tags: ['nodejs', 'jenkins-nodejs']

- name: Display Node.js version
  debug:
    msg: "Node.js version: {{ node_version.stdout }}"
  tags: ['nodejs', 'jenkins-nodejs']

- name: Install pnpm globally
  npm:
    name: pnpm
    global: yes
    state: present
  tags: ['nodejs', 'jenkins-nodejs']

- name: Verify pnpm installation
  command: pnpm --version
  register: pnpm_version
  changed_when: false
  tags: ['nodejs', 'jenkins-nodejs']

- name: Display pnpm version
  debug:
    msg: "pnpm version: {{ pnpm_version.stdout }}"
  tags: ['nodejs', 'jenkins-nodejs']

- name: Install Ansible for Jenkins deployment tasks
  apt:
    name:
      - python3
      - python3-pip
    state: present
  when: ansible_os_family == "Debian"
  tags: ['nodejs', 'jenkins-nodejs']

- name: Install Ansible via pip
  pip:
    name: ansible
    state: present
    executable: pip3
  tags: ['nodejs', 'jenkins-nodejs']

- name: Verify Ansible installation
  command: ansible --version
  register: ansible_version
  changed_when: false
  tags: ['nodejs', 'jenkins-nodejs']

- name: Display installed tools summary
  debug:
    msg:
      - "=========================================="
      - "✅ Jenkins setup complete!"
      - "Java: {{ java_version.stderr_lines[0] | default('Installed') }}"
      - "Node.js: {{ node_version.stdout }}"
      - "pnpm: {{ pnpm_version.stdout }}"
      - "Ansible: {{ ansible_version.stdout_lines[0] }}"
      - "Jenkins port: {{ jenkins_port }}"
      - "=========================================="