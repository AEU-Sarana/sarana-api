---
# ==========================================================================
# PRODUCTION ENVIRONMENT GROUP VARIABLES
# Located: ansible/inventories/production/group_vars/all.yml
# This file contains production-specific configuration for all groups
# Sensitive data is stored in group_vars/vault.yml (encrypted)
# ==========================================================================

# ===== SSH & ANSIBLE CONFIGURATION =====
# Connect as deployer (Jenkins uses deploy-ssh-key for this user). Use become: yes to run as root.
ansible_user: deployer
ansible_port: 22
ansible_ssh_private_key_file: ~/.ssh/id_rsa
ansible_python_interpreter: /usr/bin/python3
ansible_ssh_common_args: '-o StrictHostKeyChecking=no'

# ===== DEPLOYMENT USER =====
deployer_user: deployer
deployer_home: /home/deployer

# ===== APPLICATION CONFIGURATION =====
app_env: production
environment: production
node_env: production
app_name: stock-pos
app_repo: "https://github.com/yourusername/stock-pos.git"
app_branch: main
app_directory: /opt/stock-pos
app_port: 3000
app_host: 0.0.0.0

# ===== DOCKER CONFIGURATION (Production) =====
docker_image_name: stock-pos-app
docker_image_tag: latest
docker_container_name: stock-pos-app
docker_network_name: stock-pos-network
docker_registry: "{{ vault_docker_registry_url }}"
docker_registry_username: "{{ vault_docker_registry_username }}"
docker_registry_password: "{{ vault_docker_registry_password }}"

# Full image path for GHCR
docker_image_full: "{{ docker_registry }}/{{ vault_docker_registry_username }}/{{ docker_image_name }}"

# Docker resource limits (production)
docker_cpu_limit: "2"
docker_memory_limit: "2G"
docker_cpu_reservation: "1"
docker_memory_reservation: "1G"

# Docker restart and logging
docker_restart_policy: "always"
docker_log_driver: "json-file"
docker_log_options:
  max_size: "10m"
  max_file: "3"

# ===== DATABASE CONFIGURATION =====
postgres_user: "{{ vault_prod_postgres_user }}"
postgres_host: db
postgres_port: 5432
postgres_db: "{{ vault_prod_postgres_db }}"
postgres_password: "{{ vault_prod_postgres_password | string }}"
postgres_external_port: 5433

# Database Timezone Configuration (Asia/Phnom_Penh for Cambodia)
db_timezone: Asia/Phnom_Penh
system_timezone: Asia/Phnom_Penh

# Variables used by app-deploy env template (all from vault via postgres_* or literal)
db_user: "{{ postgres_user }}"
db_password: "{{ postgres_password | string }}"
db_name: "{{ postgres_db }}"
db_host: "{{ postgres_host }}"
db_port: "{{ postgres_port }}"
db_external_port: "{{ postgres_external_port }}"

# ===== REDIS CONFIGURATION =====
redis_host: redis
redis_port: 6379
redis_password: "{{ vault_prod_redis_password }}"
redis_external_port: 6380

# ===== MINIO/S3 CONFIGURATION =====
minio_endpoint: minio
minio_root_user: "{{ vault_prod_minio_root_user }}"
minio_api_port: 9000
minio_console_port: 9001
minio_root_password: "{{ vault_prod_minio_password }}"
minio_use_ssl: false
minio_bucket_name: "{{ app_name }}-storage"

# ===== STORAGE CONFIGURATION (S3/MinIO) =====
storage_provider: minio
storage_endpoint: "http://{{ minio_endpoint }}:{{ minio_api_port }}"
storage_access_key: "{{ minio_root_user }}"
storage_secret_key: "{{ minio_root_password }}"
storage_bucket: "{{ minio_bucket_name }}"
storage_region: "us-east-1"
storage_use_ssl: "false"
storage_public_url: ""

# ===== NGINX CONFIGURATION =====
nginx_http_port: 80
nginx_https_port: 443
nginx_http_port_custom: 8081
nginx_https_port_custom: 8443
nginx_internal_port: 8080  # Container nginx port

# ===== DOMAIN & SSL CONFIGURATION =====
domain: techey.tech
subdomain: familypos
app_domain: "{{ subdomain }}.{{ domain }}"  # familypos.techey.tech
enable_ssl: true
letsencrypt_email: admin@{{ domain }}
letsencrypt_staging: false  # Set to true for first test run
certbot_auto_renew: true

# ===== NGINX SSL PATHS =====
nginx_config_path: /etc/nginx/sites-available
nginx_enabled_path: /etc/nginx/sites-enabled
nginx_site_name: "{{ app_name }}"
nginx_domain: "{{ app_domain }}"

# ===== CORS & SECURITY =====
allowed_origins: "http://localhost:3000,http://localhost:8080,http://89.167.6.46,http://89.167.6.46:3000,http://89.167.6.46:8081,https://89.167.6.46,https://{{ app_domain }}"
cors_origin: "https://{{ app_domain }}"

# ===== LOGGING =====
log_level: info

# ===== SMTP CONFIGURATION =====
smtp_host: "{{ vault_smtp_host }}"
smtp_port: 587
smtp_user: "{{ vault_smtp_user }}"
smtp_pass: "{{ vault_smtp_password }}"
smtp_from: noreply@stockpos.com

# ===== APPLICATION SECRET (from vault; used as ENCRYPTION_KEY) =====
app_secret_key: "{{ vault_app_secret_key }}"

# ===== JWT CONFIGURATION (from vault) =====
jwt_secret: "{{ vault_prod_jwt_secret }}"
jwt_refresh_secret: "{{ vault_prod_jwt_refresh_secret }}"
jwt_expiration: "{{ vault_prod_jwt_expiration }}"
jwt_access_token_expiry: "{{ vault_prod_jwt_expiration }}"
jwt_refresh_token_expiry: "{{ vault_prod_jwt_expiration }}"
jwt_expires_in: "{{ vault_prod_jwt_expiration }}"

# ===== DEPLOYMENT OPTIONS =====
deploy_path: /opt/stock-pos-server
run_migrations: false
build_image: true
force_recreate: false
pull_images: true

# ===== HEALTH CHECK =====
health_check_interval: 30
health_check_timeout: 10
health_check_retries: 3
health_check_start_period: 40

# ===== BACKUP =====
backup_enabled: true
backup_directory: "/opt/backups/stock-pos"

# ===== DOCKER USERS =====
docker_users:
  - "{{ deployer_user }}"
  - jenkins

# ===== JENKINS INTEGRATION =====
jenkins_build_version: "latest"
