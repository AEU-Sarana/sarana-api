---
# ==========================================================================
# PRODUCTION ENVIRONMENT GROUP VARIABLES
# Located: ansible/inventories/production/group_vars/all.yml
# This file contains production-specific configuration for all groups
# Sensitive data is stored in group_vars/vault.yml (encrypted)
# ==========================================================================

# ===============================
# SSH & Ansible
# ===============================
# Connect as deployer (Jenkins uses deploy-ssh-key for this user). Use become: yes to run as root.
ansible_user: deployer
ansible_port: 22
ansible_ssh_private_key_file: ~/.ssh/id_rsa
ansible_python_interpreter: /usr/bin/python3
ansible_ssh_common_args: '-o StrictHostKeyChecking=no'

# ===============================
# Deployment User
# ===============================
deployer_user: deployer
deployer_home: /home/deployer

# ===============================
# Server
# ===============================
app_env: production
node_env: "{{ vault_prod_node_env }}"
host: "{{ vault_prod_host }}"
app_name: "{{ vault_prod_app_name }}"
app_repo: "{{ vault_prod_app_repo }}"
app_branch: "{{ vault_prod_app_branch }}"
app_directory: "{{ vault_prod_app_directory }}"
app_port: "{{ vault_prod_port }}"
app_host: "{{ vault_prod_app_host }}"
api_version: "{{ vault_prod_api_version }}"

# ===============================
# Blue/Green Deployment
# ===============================
blue_green_enabled: true
active_color_default: blue
active_color_state_file: "{{ app_directory }}/.active_color"
blue_app_port: 3001
green_app_port: 3002

# ===============================
# Docker Configuration
# ===============================
docker_image_name: stock-pos-server
docker_image_tag: latest
docker_container_name: stock-pos-app
docker_registry: "{{ vault_docker_registry_url }}"
docker_registry_username: "{{ vault_docker_registry_username }}"
docker_registry_password: "{{ vault_docker_registry_password }}"
docker_registry_namespace: "{{ vault_docker_registry_username }}"

# Full image path for GHCR
docker_image_full: "{{ docker_registry }}/{{ docker_registry_namespace }}/{{ docker_image_name }}"

# Docker resource limits (production)
docker_cpu_limit: "2"
docker_memory_limit: "2G"
docker_cpu_reservation: "1"
docker_memory_reservation: "1G"

# Docker restart and logging
docker_restart_policy: "always"
docker_log_driver: "json-file"
docker_log_options:
  max_size: "10m"
  max_file: "3"

# ===============================
# Database (PostgreSQL)
# ===============================
postgres_user: "{{ vault_prod_postgres_user }}"
postgres_host: "{{ vault_prod_postgres_host }}"
postgres_port: "{{ vault_prod_postgres_port }}"
postgres_db: "{{ vault_prod_postgres_db }}"
postgres_password: "{{ vault_prod_postgres_password | string }}"
postgres_external_port: "{{ vault_prod_postgres_external_port }}"

# App Timezone
db_timezone: "{{ vault_prod_db_timezone }}"
system_timezone: "{{ vault_prod_system_timezone }}"

# Variables used by app-deploy env template (all from vault via postgres_* or literal)
db_user: "{{ postgres_user }}"
db_password: "{{ postgres_password | string }}"
db_name: "{{ postgres_db }}"
db_host: "{{ postgres_host }}"
db_port: "{{ postgres_port }}"
db_external_port: "{{ postgres_external_port }}"

# ===============================
# Redis
# ===============================
redis_host: "{{ vault_prod_redis_host }}"
redis_internal_port: "{{ vault_prod_redis_port }}"
redis_port: "{{ vault_prod_redis_external_port }}"
redis_password: "{{ vault_prod_redis_password }}"
redis_url: "{{ vault_prod_redis_url }}"
redis_token_blacklist_ttl: "{{ vault_prod_redis_token_blacklist_ttl }}"

# ===============================
# MinIO
# ===============================
minio_endpoint: "{{ vault_prod_minio_endpoint }}"
minio_root_user: "{{ vault_prod_minio_root_user }}"
minio_api_port: "{{ vault_prod_minio_api_port }}"
minio_console_port: "{{ vault_prod_minio_console_port }}"
minio_root_password: "{{ vault_prod_minio_password }}"
minio_use_ssl: "{{ vault_prod_minio_use_ssl }}"
minio_bucket_name: "{{ vault_prod_minio_bucket_name }}"

# ===============================
# Storage (S3 Compatible)
# ===============================
storage_provider: "{{ vault_prod_storage_provider }}"
storage_endpoint: "{{ vault_prod_storage_endpoint }}"
storage_access_key: "{{ vault_prod_storage_access_key }}"
storage_secret_key: "{{ vault_prod_storage_secret_key }}"
storage_bucket: "{{ vault_prod_storage_bucket }}"
storage_region: "{{ vault_prod_storage_region }}"
storage_use_ssl: "{{ vault_prod_storage_use_ssl }}"
storage_public_url: "{{ vault_prod_storage_public_url }}"

# ===============================
# Nginx Ports
# ===============================
nginx_http_port: "{{ vault_prod_nginx_http_port }}"
nginx_https_port: "{{ vault_prod_nginx_https_port }}"
nginx_http_port_custom: "{{ vault_prod_nginx_http_port_custom }}"
nginx_https_port_custom: "{{ vault_prod_nginx_https_port_custom }}"
nginx_internal_port: "{{ vault_prod_nginx_internal_port }}"

# ===============================
# API URL / Domain / SSL
# ===============================
domain: "{{ vault_prod_domain }}"
subdomain: "{{ vault_prod_subdomain }}"
app_domain: "{{ subdomain }}.{{ domain }}"  # familypos.techey.tech
api_base_url: "{{ vault_prod_api_base_url }}"
app_url: "{{ vault_prod_app_url }}"
frontend_url: "{{ vault_prod_frontend_url }}"
enable_ssl: "{{ vault_prod_enable_ssl }}"
letsencrypt_email: "{{ vault_prod_letsencrypt_email }}"
letsencrypt_staging: "{{ vault_prod_letsencrypt_staging }}"
certbot_auto_renew: "{{ vault_prod_certbot_auto_renew }}"

# ===============================
# Nginx SSL Paths
# ===============================
nginx_config_path: /etc/nginx/sites-available
nginx_enabled_path: /etc/nginx/sites-enabled
nginx_site_name: "{{ app_name }}"
nginx_domain: "{{ app_domain }}"

# ===============================
# CORS
# ===============================
allowed_origins: "{{ vault_prod_allowed_origins }}"
cors_origin: "{{ vault_prod_cors_origin }}"

# ===============================
# Logging
# ===============================
log_level: "{{ vault_prod_log_level }}"

# ===============================
# Email Service (SMTP)
# ===============================
smtp_host: "{{ vault_prod_smtp_host }}"
smtp_port: "{{ vault_prod_smtp_port }}"
smtp_user: "{{ vault_prod_smtp_user }}"
smtp_pass: "{{ vault_prod_smtp_password }}"
smtp_from: "{{ vault_prod_smtp_from }}"
email_from: "{{ vault_prod_email_from }}"

# ===============================
# Security / Encryption
# ===============================
vault_app_secret_key: "{{ vault_prod_encryption_key }}"
app_secret_key: "{{ vault_prod_encryption_key }}"
backup_encryption_key: "{{ vault_prod_backup_encryption_key }}"
receipt_qr_hmac_secret: "{{ vault_prod_receipt_qr_hmac_secret }}"

# ===============================
# JWT
# ===============================
jwt_secret: "{{ vault_prod_jwt_secret }}"
jwt_refresh_secret: "{{ vault_prod_jwt_refresh_secret }}"
jwt_expiration: "{{ vault_prod_jwt_expires_in }}"
jwt_access_token_expiry: "{{ vault_prod_jwt_access_token_expiry }}"
jwt_refresh_token_expiry: "{{ vault_prod_jwt_refresh_expires_in }}"
jwt_expires_in: "{{ vault_prod_jwt_expires_in }}"
jwt_v2_access_token_expiry: "{{ vault_prod_jwt_v2_access_token_expiry }}"
jwt_v2_refresh_absolute_days: "{{ vault_prod_jwt_v2_refresh_absolute_days }}"
jwt_v2_refresh_idle_days: "{{ vault_prod_jwt_v2_refresh_idle_days }}"
jwt_issuer: "{{ vault_prod_jwt_issuer }}"
jwt_audience: "{{ vault_prod_jwt_audience }}"

# ===============================
# Telegram (Optional)
# ===============================
telegram_bot_token: "{{ vault_prod_telegram_bot_token }}"
telegram_chat_id: "{{ vault_prod_telegram_chat_id }}"
telegram_webhook_secret: "{{ vault_prod_telegram_webhook_secret }}"
brevo_api_key: "{{ vault_prod_brevo_api_key }}"
brevo_sender_email: "{{ vault_prod_brevo_sender_email }}"
brevo_sender_name: "{{ vault_prod_brevo_sender_name }}"

# ===============================
# Cloudflare R2 (Optional)
# ===============================
r2_account_id: "{{ vault_prod_r2_account_id }}"
r2_access_key_id: "{{ vault_prod_r2_access_key_id }}"
r2_secret_access_key: "{{ vault_prod_r2_secret_access_key }}"
r2_bucket_name: "{{ vault_prod_r2_bucket }}"
r2_endpoint: "{{ vault_prod_r2_endpoint }}"

# ===============================
# Password Hashing
# ===============================
bcrypt_salt_rounds: "{{ vault_prod_bcrypt_salt_rounds }}"

# ===============================
# Deployment Options
# ===============================
deploy_path: /opt/stock-pos-server
run_migrations: false
build_image: true
force_recreate: false
pull_images: true

# ===============================
# Health Check
# ===============================
health_check_interval: 30
health_check_timeout: 10
health_check_retries: 3
health_check_start_period: 40

# ===============================
# Monitoring
# ===============================
node_exporter_enabled: true
node_exporter_port: 9100
node_exporter_bind_address: 0.0.0.0
node_exporter_allowed_source_ip: 37.27.180.31
cadvisor_enabled: true
cadvisor_port: 8088
cadvisor_bind_address: 0.0.0.0

# ===============================
# Backup
# ===============================
backup_enabled: true
backup_directory: "/opt/backups/stock-pos"

# ===============================
# Docker Users
# ===============================
docker_users:
  - "{{ deployer_user }}"
  - jenkins

# ===============================
# Jenkins Integration
# ===============================
jenkins_build_version: "latest"
