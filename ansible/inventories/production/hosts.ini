# Ansible Inventory File (INI Format)
# Alternative to hosts.yml

[app_servers]
app-server-01 ansible_host=192.168.1.100 ansible_user=ubuntu ansible_port=22

[app_servers:vars]
# Python interpreter
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args='-o StrictHostKeyChecking=no'

# Application Configuration
app_name=stock-pos
app_repo=https://github.com/yourusername/stock-pos.git
app_branch=main
app_directory=/opt/stock-pos

# Docker Image Settings
docker_image_name=stock-pos-app
docker_image_tag=latest
docker_registry=

# Environment
node_env=production

# Database Configuration
db_user=postgres
db_password=SecurePassword123!
db_name=stock_pos
db_port=5433

# Redis Configuration
redis_port=6380

# Minio Configuration
minio_root_user=minioadmin
minio_root_password=MinioSecurePass123!
minio_api_port=9000
minio_console_port=9001

# Nginx Configuration
nginx_http_port=8081
nginx_https_port=8443

# Optional: JWT Secret (generate a secure key)
# jwt_secret=your_jwt_secret_key_here

# Optional: CORS Origin
# cors_origin=*

# Optional: Log Level
# log_level=info