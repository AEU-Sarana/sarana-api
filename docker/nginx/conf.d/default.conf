upstream backend {
    server app:3000 max_fails=3 fail_timeout=30s;
    least_conn;
    keepalive 32;
}

# HTTP - Tunnel host & Local IPs: proxy to backend (no redirect)
server {
    listen 80;
    # Include local IPs here so Cloudflared can access without redirect
    server_name men-safe-starring-trivia.trycloudflare.com 192.168.18.29 localhost 127.0.0.1;

        access_log /var/log/nginx/api_access.log;
        error_log  /var/log/nginx/api_error.log;

        location = /health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "OK\n";
        }

        location / {
            limit_req zone=api_limit burst=20 nodelay;
            limit_req_status 429;

            proxy_pass http://backend;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
        
        }

    }

# HTTP - Catch-all: redirect to canonical HTTPS tunnel domain
server {
            listen 80 default_server;
            server_name _;

            access_log /var/log/nginx/api_access.log;
            error_log  /var/log/nginx/api_error.log;

            location = /health {
                access_log off;
                add_header Content-Type text/plain;
                return 200 "OK\n";
            }

            location / {
                limit_req zone=api_limit burst=20 nodelay;
                limit_req_status 429;

                proxy_pass http://backend;
                proxy_http_version 1.1;

                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection $connection_upgrade;

                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header X-Forwarded-Host $host;
                proxy_set_header X-Forwarded-Port $server_port;
            }
        }
