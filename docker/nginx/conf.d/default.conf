upstream backend {
    server app:3000 max_fails=3 fail_timeout=30s;
    least_conn;
    keepalive 32;
}

# HTTP - Tunnel host & Local IPs: proxy to backend (no redirect)
server {
    listen 80;
    # Include local IPs here so Cloudflared can access without redirect
    server_name  changes-vpn-fever-active.trycloudflare.com 192.168.18.29 localhost 127.0.0.1;

        access_log /var/log/nginx/api_access.log;
        error_log  /var/log/nginx/api_error.log;

        location = /health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "OK\n";
        }

        location / {
            limit_req zone=api_limit burst=20 nodelay;
            limit_req_status 429;

            proxy_pass http://backend;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
        
        }

    }

# HTTP - Catch-all: redirect to canonical HTTPS tunnel domain
server {
            listen 80 default_server;
            server_name _;

            access_log /var/log/nginx/api_access.log;
            error_log  /var/log/nginx/api_error.log;

            location = /health {
                access_log off;
                add_header Content-Type text/plain;
                return 200 "OK\n";
            }

            location / {
                return 301  https://changes-vpn-fever-active.trycloudflare.com$request_uri;
            }
        }

        # HTTPS - Tunnel domain
        server {
            listen 443 ssl http2;
            server_name changes-vpn-fever-active.trycloudflare.com;

            ssl_certificate     /etc/nginx/ssl/origin-ca.pem;
            ssl_certificate_key /etc/nginx/ssl/origin-ca-key.pem;

            ssl_protocols TLSv1.2 TLSv1.3;
            ssl_prefer_server_ciphers off;
            ssl_session_cache shared:SSL:10m;
            ssl_session_timeout 10m;
            ssl_session_tickets off;

            add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
            add_header X-Frame-Options DENY;
            add_header X-Content-Type-Options nosniff;
            add_header X-XSS-Protection "1; mode=block";

            access_log /var/log/nginx/api_access.log;
            error_log  /var/log/nginx/api_error.log;

            location = /health {
                access_log off;
                add_header Content-Type text/plain;
                return 200 "OK\n";
            }

            location ^~ /api/auth/ {
                limit_req zone=auth_limit burst=10 nodelay;
                limit_req_status 429;

                proxy_pass http://backend;
                proxy_http_version 1.1;

                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection $connection_upgrade;

                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header X-Forwarded-Host $host;
                proxy_set_header X-Forwarded-Port $server_port;

                proxy_connect_timeout 60s;
                proxy_send_timeout 60s;
                proxy_read_timeout 120s;
                proxy_buffering off;
            }

            location /api/ {
                limit_req zone=api_limit burst=20 nodelay;
                limit_req_status 429;

                proxy_pass http://backend;
                proxy_http_version 1.1;

                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection $connection_upgrade;

                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_set_header X-Forwarded-Host $host;
                proxy_set_header X-Forwarded-Port $server_port;

                proxy_connect_timeout 60s;
                proxy_send_timeout 60s;
                proxy_read_timeout 120s;
                proxy_buffering off;
            }

            location = / {
                proxy_pass http://backend;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection $connection_upgrade;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_connect_timeout 60s;
                proxy_send_timeout 60s;
                proxy_read_timeout 120s;
            }

            location /api/upload {
                client_max_body_size 200M;

                proxy_pass http://backend;
                proxy_http_version 1.1;

                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;

                proxy_connect_timeout 300s;
                proxy_send_timeout 300s;
                proxy_read_timeout 300s;
            }

            location /storage/ {
                proxy_pass http://backend;
                proxy_http_version 1.1;

                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;

                add_header Access-Control-Allow-Origin * always;
                add_header Access-Control-Allow-Methods 'GET, HEAD, OPTIONS' always;
                add_header Access-Control-Allow-Headers 'Range' always;

                proxy_connect_timeout 60s;
                proxy_send_timeout 60s;
                proxy_read_timeout 60s;
            }

            error_page 502 503 504 /50x.json;
            location = /50x.json {
                default_type application/json;
                return 502 '{"error":"Service temporarily unavailable"}';
            }
        }