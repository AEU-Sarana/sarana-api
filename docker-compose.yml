services:
# Database
  db:
    image: postgres:15-alpine
    container_name: stock-pos-db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-stock_pos}
      TZ: Asia/Phnom_Penh
      PGTZ: Asia/Phnom_Penh
    command: ["postgres", "-c", "timezone=Asia/Phnom_Penh"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5433}:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal-network

  # Redis for Bull Queue (optional, if you use it)
  redis:
    image: redis:7-alpine
    container_name: stock-pos-redis
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal-network


  # Minio for object storage
  minio:
    image: minio/minio:latest
    container_name: stock-pos-minio
    ports:
      - "${MINIO_API_PORT:-9000}:9000"      
      - "${MINIO_CONSOLE_PORT:-9001}:9001"   
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped
    networks:
      - internal-network


  nginx:
    image: nginx:alpine
    container_name: stock-pos-nginx
    ports:
      - "${NGINX_HTTP_PORT:-8080}:80"
      - "${NGINX_HTTPS_PORT:-8443}:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
      - nginx-cache:/var/cache/nginx
      - nginx-logs:/var/log/nginx
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    networks:
      - internal-network
    profiles:
      - dev

volumes:
  postgres-data:
  nginx-cache:
  nginx-logs:
  minio-data:
  redis-data:
  app-logs:

networks:
  internal-network:
    driver: bridge
  external-network:
    driver: bridge
